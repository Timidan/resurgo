<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F3F6FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1420" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Resurgo fresh-clones your repos, repairs what rotted, and proves each fix in a clean container before opening a pull request." />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="alternate" type="text/markdown" href="/index.md" title="Agent view" />
    <meta property="og:image" content="/brand/og-card.png" />
    <title>Resurgo — your projects, runnable again</title>
    <script>
      // Apply a saved theme before first paint. No saved choice: the system preference decides.
      try {
        var t = localStorage.getItem("resurgo-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
