    html += stage(step,time-starts[i],ends[i]-starts[i],time,[step.output_tail[0],step.output_tail[4],step.output_tail[7]]);
    if(time-starts[i]>=1700) html += `<div class="line muted" style="font-size:12px">${escape(step.output_tail[3].split(' The following')[0])}</div>`;
  } else if(time < 15800) {
    const step = installs[3];
    html += stage(step,time-starts[2],ends[2]-starts[2],time,[step.output_tail[6]]);
    html += diffHTML;
  } else {
    html += '<div class="separator">clean container · fresh clone + fix only</div>';
    const prep = verify.slice(0,3);
    html += `<div class="preflight">${prep.map(s=>`✓ ${escape(s.name)} ${seconds(s)}`).join(' &nbsp;·&nbsp; ')}</div>`;
    const step = verify[3];
    html += stage(step,time-15800,5000,time,[step.output_tail[18],step.output_tail[19]]);
    if(time >= 20800) html += `<div class="verdict"><strong>✓ ${escape(run.result)}</strong><span>verifier ${run.verifier.passed ? 'passed' : 'failed'}</span><small>install verified</small></div>`;
  }
  document.getElementById('terminal').innerHTML = html;
  document.getElementById('agent').innerHTML = run.agent.attempts.map((attempt,i) => {
    const visible = time >= starts[i], finished = time >= ends[i];
    const opacity = visible ? Math.min(1,(time-starts[i])/250) : 0;
    return `<article class="agent-card ${active===i ? 'active' : ''}" style="opacity:${opacity}" aria-hidden="${!visible}"><div class="agent-heading"><span>ATTEMPT ${String(i+1).padStart(2,'0')}</span><span class="${finished ? tone(installs[i+1]) : ''}">${finished ? symbol(installs[i+1])+' '+escape(attempt.result) : seconds(run.model_calls[i])+' model call'}</span></div><p>“${escape(excerpts[i])}${i===0 ? '…' : ''}”</p></article>`;
  }).join('');
  document.getElementById('progress').style.width = `${time/duration*100}%`;
  document.getElementById('pause').textContent = paused || time === duration ? 'Play' : 'Pause';
  document.getElementById('theme').textContent = document.documentElement.dataset.theme === 'dark' ? 'Light theme' : 'Dark theme';
}
// A single supplied clock controls typing, output, spinners, cursor and reveals.
window.replay = {render, duration, run, patch, excerpts};
function frame(now) {
  if(origin === null) origin = now;
  if(!paused) render(reduced.matches ? duration : offset + now-origin);
  if(lastTime < duration) frameId = requestAnimationFrame(frame);
}
function start() { cancelAnimationFrame(frameId); paused=false; offset=0; origin=null; render(reduced.matches ? duration : 0); if(!reduced.matches && !params.has('capture')) frameId = requestAnimationFrame(frame); }
document.getElementById('replay').onclick = start;
document.getElementById('pause').onclick = () => { if(lastTime===duration) return start(); paused=!paused; offset=lastTime; origin=performance.now(); render(lastTime); };
document.getElementById('theme').onclick = () => { document.documentElement.dataset.theme = document.documentElement.dataset.theme==='dark' ? 'light' : 'dark'; render(lastTime); };
reduced.addEventListener('change', start);
function resize() { const scale = Math.min(1,innerWidth/1280); document.querySelector('main').style.transform=`scale(${scale})`; document.body.style.height=`${720*scale}px`; }
addEventListener('resize',resize); resize(); start();
</script>
</body>
